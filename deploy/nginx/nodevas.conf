# Nodevas Production Nginx Configuration
# Place in /etc/nginx/conf.d/nodevas.conf or /etc/nginx/sites-available/nodevas

# Rate limiting zones
# 1. General API limit: 60 req/s per IP with burst of 120
limit_req_zone $binary_remote_addr zone=nodevas_api_limit:10m rate=60r/s;
# 2. Heavy operations limit: 10 req/s per IP with burst of 20
limit_req_zone $binary_remote_addr zone=nodevas_heavy_limit:10m rate=10r/s;
# 3. Connection limit: maximum 30 concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=nodevas_conn_limit:10m;

# Map to determine connection upgrade for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nodevas.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nodevas.example.com;

    # TLS Certificates (manage via Certbot / ACME)
    ssl_certificate /etc/letsencrypt/live/nodevas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodevas.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Connection and Request Limits
    limit_conn nodevas_conn_limit 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Body and Header Limits
    client_max_body_size 32M;
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Nodevas upstream running on loopback
    location / {
        limit_req zone=nodevas_api_limit burst=120 nodelay;

        proxy_pass http://127.0.0.1:5666;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for API proxying
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer configurations
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Heavy routes with stricter rate limits
    location ~* ^/api/(export|projects/export|projects/import|remote/push|remote/import) {
        limit_req zone=nodevas_heavy_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5666;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Allow longer processing time for heavy exports/imports
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket endpoint
    location /ws {
        limit_req zone=nodevas_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5666;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time interaction
        proxy_buffering off;

        # Keep alive for active WebSocket connections (e.g. 24h with client pings)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
