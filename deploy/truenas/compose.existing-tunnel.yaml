# Variant for a TrueNAS host that already runs the community "cloudflared"
# app. Nodevas joins that app's bridge network instead of bundling its own
# cloudflared, and still publishes no host port. In the Cloudflare dashboard,
# point the Public Hostname at http://nodevas:5666.
#
# Before installing: load or pull the image, adjust every /mnt/tank path, and
# confirm the network name and subnet with
#   docker network inspect ix-cloudflared_default
name: nodevas

services:
  bootstrap:
    image: ghcr.io/staphit/nodevas:latest
    pull_policy: always
    user: "568:568"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        marker=/data/.nodevas-bootstrap-complete
        if [ -f "$${marker}" ]; then
          echo "Nodevas account bootstrap already complete"
          exit 0
        fi
        if ! /usr/local/bin/nodevas user list --project /data |
          cut -f1 | grep -Fxq "$${NODEVAS_ADMIN_USER}"; then
          /usr/local/bin/nodevas user add --project /data \
            --user "$${NODEVAS_ADMIN_USER}" --role admin --password-stdin \
            < /run/secrets/nodevas_admin_password
        fi
        /usr/local/bin/nodevas user pin --project /data \
          --user "$${NODEVAS_ADMIN_USER}" --email "$${NODEVAS_ADMIN_EMAIL}"
        umask 077
        touch "$${marker}"
    environment:
      NODEVAS_ADMIN_USER: admin
      NODEVAS_ADMIN_EMAIL: admin@example.com
      XDG_CONFIG_HOME: /data/.config
    volumes:
      - /mnt/tank/apps/nodevas/workspace:/data
    secrets:
      - source: nodevas_admin_password
        target: nodevas_admin_password
        uid: "568"
        gid: "568"
        mode: 0400
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  nodevas:
    image: ghcr.io/staphit/nodevas:latest
    pull_policy: always
    user: "568:568"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      XDG_CONFIG_HOME: /data/.config
      NODEVAS_SERVE_LISTEN: 0.0.0.0
      NODEVAS_SERVE_PORT: "5666"
      NODEVAS_SERVE_HOSTNAME: nodevas.example.com
      NODEVAS_SERVE_BEHIND_PROXY: "true"
      # cloudflared gets a dynamic address on the app network, so trust the
      # network rather than one IP. Only cloudflared and Nodevas sit on it.
      NODEVAS_SERVE_TRUSTED_PROXY: 172.16.1.0/24
      NODEVAS_SERVE_ALLOW_PLAINTEXT: "true"
      # Without SMTP the server starts, but nobody can sign in.
      NODEVAS_SERVE_SMTP_HOST: smtp.example.com
      NODEVAS_SERVE_SMTP_PORT: "587"
      NODEVAS_SERVE_SMTP_USER: nodevas@example.com
      NODEVAS_SERVE_SMTP_FROM: Nodevas <nodevas@example.com>
      NODEVAS_SERVE_SMTP_SECURITY: starttls
      NODEVAS_SMTP_PASSWORD_FILE: /run/secrets/nodevas_smtp_password
    volumes:
      - /mnt/tank/apps/nodevas/workspace:/data
    secrets:
      - source: nodevas_smtp_password
        target: nodevas_smtp_password
        uid: "568"
        gid: "568"
        mode: 0400
    expose:
      - "5666"
    networks:
      cloudflared:
        aliases:
          - nodevas
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 45s
    restart: unless-stopped

networks:
  cloudflared:
    external: true
    name: ix-cloudflared_default

secrets:
  nodevas_admin_password:
    file: /mnt/tank/apps/nodevas/secrets/admin-password
  nodevas_smtp_password:
    file: /mnt/tank/apps/nodevas/secrets/smtp-password
