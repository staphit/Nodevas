name: nodevas-security-lab

x-nodevas-image: &nodevas-image
  image: ${NODEVAS_IMAGE:-nodevas:security-lab}
  build:
    context: .
    dockerfile: Dockerfile

services:
  mailpit:
    image: axllent/mailpit:v1.26.0
    restart: unless-stopped
    depends_on:
      nodevas:
        condition: service_started
    # Mailpit's SMTP listener shares Nodevas' network namespace, so the lab's
    # plaintext relay is loopback-only and never crosses the Docker bridge.
    network_mode: service:nodevas
    command:
      - --listen
      - 0.0.0.0:8025
      - --smtp
      - 127.0.0.1:1025

  bootstrap:
    <<: *nodevas-image
    restart: "no"
    environment:
      XDG_CONFIG_HOME: /var/lib/nodevas/config
      NODEVAS_ADMIN_USER: ${NODEVAS_ADMIN_USER:-admin}
      NODEVAS_ADMIN_EMAIL: ${NODEVAS_ADMIN_EMAIL:-admin@example.test}
      NODEVAS_ADMIN_PIN: ${NODEVAS_ADMIN_PIN:?Set NODEVAS_ADMIN_PIN before starting}
      NODEVAS_ADMIN_PASSWORD_FILE: /run/secrets/nodevas_admin_password
    secrets:
      - nodevas_admin_password
    volumes:
      - nodevas-workspace:/var/lib/nodevas/workspace
      - nodevas-config:/var/lib/nodevas/config
    entrypoint: ["/usr/local/bin/nodevas-bootstrap"]

  nodevas:
    <<: *nodevas-image
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      XDG_CONFIG_HOME: /var/lib/nodevas/config
      NODEVAS_SERVE_LISTEN: 0.0.0.0
      NODEVAS_SERVE_PORT: "5666"
      NODEVAS_SERVE_HOSTNAME: nodevas.localhost
      NODEVAS_SERVE_BEHIND_PROXY: "true"
      # The app-to-Caddy hop is plain HTTP, but it is only on this private
      # Docker network and the Nodevas port is not published to the host.
      NODEVAS_SERVE_ALLOW_PLAINTEXT: "true"
      # Caddy's bridge address is inside Docker's private ranges. Keep the
      # proxy hop trusted, but do not expose the Nodevas port to the host.
      NODEVAS_SERVE_TRUSTED_PROXY: 172.16.0.0/12
      NODEVAS_SERVE_SMTP_HOST: 127.0.0.1
      NODEVAS_SERVE_SMTP_PORT: "1025"
      NODEVAS_SERVE_SMTP_SECURITY: none
      NODEVAS_SERVE_SMTP_FROM: Nodevas <no-reply@example.test>
      NODEVAS_SERVE_MAX_ACTIVE_USERS: "4"
      NODEVAS_SMTP_PASSWORD: ""
    volumes:
      - nodevas-workspace:/var/lib/nodevas/workspace
      - nodevas-config:/var/lib/nodevas/config
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "5666"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5666/api/auth/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      - serve
      - --project
      - /var/lib/nodevas/workspace
      - --listen
      - 0.0.0.0
      - --port
      - "5666"
      - --hostname
      - nodevas.localhost
      - --behind-proxy=true
      - --allow-plaintext=true
      - --trusted-proxy
      - 172.16.0.0/12
      - --smtp-host
      - 127.0.0.1
      - --smtp-port
      - "1025"
      - --smtp-security
      - none
      - --smtp-from
      - Nodevas <no-reply@example.test>
      - --max-active-users
      - "4"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      nodevas:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  nodevas_admin_password:
    file: ./docker/secrets/admin-password.txt

volumes:
  nodevas-workspace:
  nodevas-config:
  caddy-data:
  caddy-config:
