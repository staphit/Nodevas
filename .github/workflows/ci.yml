name: CI

# Every push and pull request, so a red suite is caught before it is merged
# rather than at release time.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # gin's binding package pulls in a MessagePack codec this server never
      # renders. Dropping it saves ~9 MB in the shipped binary; every build of
      # ./cmd/nodevas uses the same tag so dev and release stay identical.
      GOFLAGS: -tags=nomsgpack
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needs to run on:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Every package's tests on the service container: internal/testpg gives
      # each test a fresh migrated database on it. (The embedded-pg job below
      # runs the same helpers against the embedded server instead.)
      - name: Test
        env:
          NODEVAS_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
        run: go test ./...

      # SQLite is linked only by the one-time importer (internal/legacysqlite),
      # and a build without it links none at all.
      - name: Only the importer links SQLite
        run: |
          go build -tags nomsgpack,nosqliteimport ./...
          if go list -deps -tags nomsgpack,nosqliteimport ./cmd/nodevas | grep -q '^modernc.org/sqlite$'; then
            echo "the nosqliteimport build still links modernc.org/sqlite"
            exit 1
          fi
          if go list -f '{{.ImportPath}} {{join .Imports " "}}' ./... | grep 'modernc.org/sqlite' | grep -v '^nodevas/internal/legacysqlite '; then
            echo "only internal/legacysqlite may import modernc.org/sqlite"
            exit 1
          fi

      # A public repository is read by people looking for a way in. A known-bad
      # dependency is the cheapest one to find, so the build fails on it rather
      # than leaving it for someone else to notice.
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No dependency runs an install script; esbuild's, the one the build
      # needs, runs explicitly from the lockfile's own copy.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefix web
          node web/node_modules/esbuild/install.js

      - name: Type-check
        working-directory: web
        run: npm exec -- tsc -b

      # domain/registry.ts says which store entry points may write each
      # persisted concept. This is what makes that binding instead of advisory.
      - name: Components go through the store
        run: npm --prefix web run check:api-imports

      - name: Unit tests
        run: npm --prefix web run test

      - name: Build bundle
        run: npm run build --prefix web

      # `//go:embed all:dist` matches the tracked .gitkeep just as happily as a
      # real build, so a Go binary compiled against an empty dist serves a 404
      # wall instead of the app and nothing fails until someone opens it.
      - name: The frontend really was built
        run: test -s web/dist/index.html

      - name: Known vulnerabilities
        run: npm audit --audit-level=high --prefix web

      # The desktop shell's whole tree, the packaging toolchain included:
      # Electron is what ships to users, and electron-builder runs in the
      # release job next to its token and signing secrets.
      - name: Known vulnerabilities in the desktop shell
        run: npm audit --audit-level=high --prefix desktop

  # The embedded PostgreSQL on every desktop platform, with the real pinned
  # binaries: install (verified against the compiled-in SHA-256), loopback
  # only, secrets, supervision, stale-pid recovery, a serve that starts it,
  # answers and stops it. Without NODEVAS_TEST_DATABASE_URL the database tests
  # here run on internal/testpg's embedded server too.
  embedded-pg:
    name: Embedded PostgreSQL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -tags=nomsgpack
      NODEVAS_PG_REAL: "1"
      NODEVAS_PG_HOME: ${{ github.workspace }}/../nodevas-pg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The archive is keyed on the manifest that pins it: a new pin is a new
      # download, verified again.
      - name: Cache the PostgreSQL binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../nodevas-pg/dist
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/embeddedpg/manifest.go') }}

      - name: Install the pinned PostgreSQL
        run: |
          go run ./cmd/nodevas db install-postgres
          echo "NODEVAS_PG_BINARIES=$NODEVAS_PG_HOME/dist/17.11.1-$(go env GOOS)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - name: Test
        run: >-
          go test -count=1 ./internal/embeddedpg/... ./internal/dbconn/... ./internal/db/...
          ./internal/searchindex/... ./internal/legacysqlite/... ./cmd/nodevas/

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The suite drives the real binary, so it needs both toolchains. It runs
    # on its own so a browser hiccup never hides a Go or unit-test failure.
    timeout-minutes: 25
    # One server for the run; every worker gets a database of its own on it
    # (web/e2e/database.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODEVAS_E2E_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No dependency runs an install script; esbuild's, the one the build
      # needs, runs explicitly from the lockfile's own copy.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefix web
          node web/node_modules/esbuild/install.js

      - name: Install Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium

      # e2e/serve.mjs builds web/dist and the Go binary itself, then serves a
      # throwaway workspace.
      - name: Run Playwright
        run: npm run e2e --prefix web

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 1

  # scripts/install.sh runs on a fresh PC in Git Bash, Linux and macOS's own
  # bash 3.2, and is what checks the binary it fetches from GitHub.
  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning scripts/install.sh scripts/install_test.sh

      - name: Syntax
        run: bash -n scripts/install.sh

      - name: Tests
        run: bash scripts/install_test.sh

      - name: Tests on macOS's bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/install_test.sh

  naming:
    name: Naming
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The product was renamed from vised to nodevas and the dev scripts were
      # left behind, which only surfaced when the server refused to start.
      # Tracked files only: build output keeps the old name around for a while.
      - name: The old command path is gone
        run: |
          if git grep -n -e 'cmd/vised' \
              -- . ':!.github/workflows/ci.yml'; then
            echo "cmd/vised no longer exists; the command lives at ./cmd/nodevas"
            exit 1
          fi

      # scripts/ mentions vised.exe on purpose: it stops leftover instances
      # from a build made before the rename.
      - name: The old binary name is not built anywhere
        run: |
          if git grep -n -e 'vised\.exe' \
              -- . ':!scripts' ':!.github/workflows/ci.yml'; then
            echo "the build output is nodevas.exe"
            exit 1
          fi
