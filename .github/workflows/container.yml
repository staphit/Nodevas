name: Container image

# Publishes the image. It does not run on pull requests: the CI workflow
# already builds and tests the same code there, and an emulated arm64 build
# that pushes nothing only made every PR wait a quarter of an hour.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "testflight-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build amd64 and arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nodevas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The hub reports this commit to its runners (GET
          # /api/runner/version); scripts/install.sh fetches the cli job's
          # build of the same commit for them.
          build-args: |
            NODEVAS_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # The nodevas binary for runner PCs and standalone installs, so neither needs
  # Go. GitHub is its trust root, not the hub: each binary gets a GitHub build
  # provenance attestation, and is published to ghcr.io as a single-file OCI
  # artifact per platform:
  #   ghcr.io/<owner>/nodevas-cli:<commit>-<os>-<arch>   every run
  #   ghcr.io/<owner>/nodevas-cli:latest-<os>-<arch>     the default branch
  #   ghcr.io/<owner>/nodevas-cli:<tag>-<os>-<arch>      a v* tag
  # plus one artifact of all of them and SHA256SUMS (<commit>, sha-<short>,
  # latest, <tag>) for pulling by hand with oras. scripts/install.sh fetches
  # the build of the commit the hub reports and checks it against the digest
  # ghcr.io lists and, with gh, the attestation; see docs/install.md.
  cli:
    name: Runner binaries
    # Attested binaries are what runners install, so only reviewed code gets
    # them: master and release tags, never a workflow_dispatch on a branch.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/testflight-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache in a job that publishes: a cache another run wrote
      # would go into a signed binary.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # As the Dockerfile does: no dependency runs an install script;
      # esbuild's, the one the build needs, runs explicitly.
      - name: Build the web app
        run: |
          npm ci --ignore-scripts --prefix web
          node web/node_modules/esbuild/install.js
          npm run build --prefix web

      # `//go:embed all:dist` matches the tracked .gitkeep just as happily as a
      # real build, so a binary built against an empty dist serves a 404 wall.
      - name: The web app really was built
        run: test -s web/dist/index.html

      # The Dockerfile's flags, so a runner's binary and the hub's image are
      # the same build of the same commit.
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "${os}" = windows ]; then
              ext=".exe"
            fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -tags=nomsgpack -trimpath \
              -ldflags="-s -w -X nodevas/internal/buildinfo.commit=${GITHUB_SHA}" \
              -o "dist/nodevas-${os}-${arch}${ext}" ./cmd/nodevas
          done
          (cd dist && sha256sum nodevas-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: The linux binary reports its commit
        run: |
          got="$(./dist/nodevas-linux-amd64 runner status --config "${RUNNER_TEMP}/runner.json" | sed -n 's/^commit: *//p')"
          if [ "${got}" != "${GITHUB_SHA}" ]; then
            echo "::error::the binary says it is commit '${got}', not ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nodevas-*

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Publish to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nodevas-cli"
          printf '%s' "${GITHUB_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          # Tags that move: latest on the default branch, the tag's own name
          # on a tag push (when it is a valid OCI tag).
          moving=()
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            moving+=(latest)
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$'; then
            moving+=("${GITHUB_REF_NAME}")
          fi

          annotations=(
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}"
            --annotation "org.opencontainers.image.description=nodevas command-line binary (scripts/install.sh)"
          )
          cd dist
          bundle=()
          for file in nodevas-*; do
            platform="${file#nodevas-}"
            platform="${platform%.exe}"
            oras push "${image}:${GITHUB_SHA}-${platform}" \
              --artifact-type application/vnd.nodevas.cli.v1 "${annotations[@]}" \
              "${file}:application/octet-stream"
            for tag in ${moving[@]+"${moving[@]}"}; do
              oras tag "${image}:${GITHUB_SHA}-${platform}" "${tag}-${platform}"
            done
            bundle+=("${file}:application/octet-stream")
          done
          oras push "${image}:${GITHUB_SHA}" \
            --artifact-type application/vnd.nodevas.cli.v1 "${annotations[@]}" \
            "${bundle[@]}" SHA256SUMS:text/plain
          oras tag "${image}:${GITHUB_SHA}" "sha-${GITHUB_SHA:0:7}" ${moving[@]+"${moving[@]}"}
